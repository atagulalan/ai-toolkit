# Ghostty config snippet for AI Toolkit workflow
# Append or merge into your Ghostty config:
#   - Linux/macOS (XDG): $HOME/.config/ghostty/config
#   - macOS (alt): $HOME/Library/Application Support/com.mitchellh.ghostty/config
# See https://ghostty.org/docs/config

# Optional: alias to open ai-toolkit (or current project) in Cursor
# Adjust PATH_TO_AI_TOOLKIT to your clone, e.g. $HOME/dev/ai-toolkit
# [env]
# CURSOR_AI_TOOLKIT = /path/to/ai-toolkit

# Shell alias example (add to your shell profile; Ghostty runs your default shell):
# alias aitoolkit='cd /path/to/ai-toolkit && cursor .'
# alias aitopen='cursor .'

# No Ghostty-specific keys required for basic use; use your shell's aliases
# or add custom keybinds in Ghostty to run `cursor .` in the current directory.
